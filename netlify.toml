# Netlify: drag this folder onto app.netlify.com/drop, or connect the repo.
[build]
  publish = "."

# AI assistant: server function at /api/assistant (netlify/functions/assistant.mjs).
# Set ANTHROPIC_API_KEY in Site settings → Environment variables; without it the assistant stays off.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"
